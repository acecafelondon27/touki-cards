<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b4d"><link rel="manifest" href="manifest.webmanifest"><title>不動産登記 暗記カード</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f4f6fa;color:#182438}main{max-width:650px;margin:auto;padding:22px 16px 70px}h1{font-size:22px}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;background:#173c74;color:white;cursor:pointer}button.secondary{background:#e3eaf3;color:#1c3454}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.panel{background:white;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 2px 12px #10213a0c}.card{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:pre-wrap;font-size:21px;line-height:1.65;cursor:pointer}.muted{color:#69758a;font-size:13px}.hidden{display:none}.grow{flex:1}select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;max-width:100%}button:disabled{opacity:.45}small{font-size:12px}</style></head><body><main><h1>不動産登記・暗記カード</h1><div class="muted">司法書士試験 2028｜オフライン対応・端末内保存</div><div class="panel"><div class="row"><span id="stats" class="grow">読み込み中</span><select id="filter"><option value="due">本日の復習</option><option value="all">全カード</option><option value="missed">苦手カード</option><option value="new">未学習</option></select></div></div><div class="panel"><div class="muted" id="counter"></div><div id="card" class="card" role="button" tabindex="0">カードを読み込み中</div><div class="muted" id="source"></div><div class="row" style="justify-content:center;margin-top:14px"><button class="secondary" id="flip">答えを見る</button></div><div class="row hidden" id="grading" style="justify-content:center;margin-top:12px"><button class="secondary" id="miss">× もう一度</button><button id="know">✓ 覚えた</button></div></div><div class="panel"><b>データとバックアップ</b><p class="muted">CSV/JSONでカード追加、JSONで学習履歴をバックアップできます。データは外部送信しません。</p><div class="row"><button class="secondary" id="export">バックアップ保存</button><button class="secondary" id="importButton">カード・履歴の読込</button><input type="file" id="import" accept=".json,.csv,text/csv,application/json" class="hidden"></div><p class="muted">CSV形式：front,back,source,category（UTF-8）。JSON形式：カード配列、またはバックアップ。</p><div class="row"><button class="secondary" id="reset">学習履歴だけ初期化</button></div></div><p class="muted">復習間隔：正解時 R1→R3→R7→R14→R30。誤答時は翌日再出題。端末のブラウザデータ削除に備え、定期的にバックアップしてください。</p></main><script src="cards.js"></script><script src="app.js"></script></body></html>
